[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Map tiles come from OpenFreeMap, elevation tiles from AWS Open Data, Sentinel-2 imagery from EOX.
    # MapLibre and the contour-line library run their workers from a blob.
    # frame-src is for Power BI Publish to web reports, loaded only when a visitor clicks.
    # font-src data: is for a small font subset the bundler inlines.
    # script-src allows no inline scripts. Netlify's docs say that stops the "Powered by Netlify" badge it adds
    # to free-plan sites from rendering; the console logs the blocked script. To show the badge again, add the
    # sha256 hash the console reports to script-src.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://tiles.openfreemap.org https://s3.amazonaws.com https://tiles.maps.eox.at; frame-src https://app.powerbi.com; worker-src 'self' blob:; child-src blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
